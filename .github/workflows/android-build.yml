name: Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 手动安装 Android SDK（不依赖 setup-android action，可控且稳定）
      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-34-${{ runner.os }}

      - name: Set up Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/ct
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # 取最近一个 v* 标签作为基线，版本号 +0.0.001（patch 三位补零）
      - name: Compute next version (+0.0.001)
        id: ver
        run: |
          set -e
          TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          BASE="${TAG#v}"
          [ -z "$BASE" ] && BASE="1.0.000"
          MAJ=$(echo "$BASE" | cut -d. -f1)
          MIN=$(echo "$BASE" | cut -d. -f2)
          PAT=$(echo "$BASE" | cut -d. -f3)
          PAT=$((10#$PAT + 1))
          VER=$(printf "%s.%s.%03d" "$MAJ" "$MIN" "$PAT")
          CODE=$(( MAJ * 1000000 + MIN * 1000 + PAT ))
          echo "base tag : ${TAG:-<none>} ($BASE)"
          echo "next ver : $VER  (versionCode=$CODE)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # 取最近一个 tag 以来的提交，作为本次发布的「修改内容」
      - name: Build changelog from commits
        id: changelog
        run: |
          set -e
          PREV=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi
          LOG=$(git log $RANGE --no-merges --pretty=format:"%b")
          if [ -z "$LOG" ]; then
            LOG="- (本次无代码提交)"
          fi
          {
            echo "log<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 从 GitHub Secret 解码签名密钥库（未配置则 release 保持未签名）
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "未配置 SIGNING_KEYSTORE_BASE64，release 将保持未签名"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wu_todo.keystore"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/wu_todo.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon -Pwu.versionName=${{ steps.ver.outputs.version }} -Pwu.versionCode=${{ steps.ver.outputs.code }}

      # 产物文件名带上版本号
      - name: Rename APK with version
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/wu_todo-${V}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/wu_todo-${V}-release-unsigned.apk"
          fi
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wu_todo-${{ steps.ver.outputs.version }}
          path: out/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: wu_todo v${{ steps.ver.outputs.version }}
          body: |
            **wu_todo v${{ steps.ver.outputs.version }}**
            修改内容：
            ${{ steps.changelog.outputs.log }}
          files: out/*.apk
          generate_release_notes: false
          fail_on_unmatched_files: false
